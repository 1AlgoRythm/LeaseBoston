<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Rare words weigh more: parking 2.39, rent 2.10, and a word no saved question uses gets the maximum 3.48">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="140" y="85" height="30" rx="6" width="0" stroke="#f97316"><animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.92;1" values="0;191;191;0"/></rect>
<rect x="140" y="145" height="30" rx="6" width="0" stroke="#3b82f6"><animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.92;1" values="0;168;168;0"/></rect>
<rect x="140" y="205" height="30" rx="6" width="0" stroke="#8a8f98" stroke-dasharray="6 6"><animate attributeName="width" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.92;1" values="0;278;278;0"/></rect>
</g>
<text x="15" y="50">log((n+1)/(df+1)) + 1</text>
<text x="15" y="106" style="fill:#f97316">parking 2.39</text>
<text x="15" y="166" style="fill:#3b82f6">rent 2.10</text>
<text x="15" y="226">unseen 3.48</text>
</svg>
