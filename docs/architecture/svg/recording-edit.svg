<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="screencapture records raw.mov, pauses while a new chat opens, then records raw2.mov; edit.py adds a title card and speeds the clip so each scene lasts at most 40 seconds">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="70" width="280" height="30" rx="4"/>
<path d="M305,85 L340,85" stroke-dasharray="3 7" stroke-width="1.5"/>
<rect x="345" y="70" width="115" height="30" rx="4" stroke="#3b82f6"/>
<path d="M230,108 L230,176" stroke="#f97316" marker-end="url(#ah)"/>
<rect x="20" y="170" width="50" height="50" rx="4" stroke="#3b82f6"/>
<path d="M30,185 L60,185 M30,198 L52,198" stroke-width="1.5"/>
<path d="M85,195 L265,195" stroke="#f97316" stroke-width="14" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.96;1" values="100;0;0;100"/></path>
<path d="M105,185 L105,205 M125,185 L125,205 M145,185 L145,205 M165,185 L165,205 M185,185 L185,205 M205,185 L205,205 M225,185 L225,205 M245,185 L245,205" stroke-width="1.5" stroke="#8a8f98"/>
</g>
<circle r="5" fill="#f97316" stroke="none"><animateMotion dur="8s" repeatCount="indefinite" path="M20,85 L300,85" keyPoints="0;0;1;1" keyTimes="0;0.02;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;0.52;1" values="1;1;0;0"/></circle>
<circle r="5" fill="#3b82f6" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M345,85 L460,85" keyPoints="0;0;1;1" keyTimes="0;0.58;0.8;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.58;0.6;0.8;0.82;1" values="0;0;1;1;0;0"/></circle>
<text x="20" y="58">raw.mov</text>
<text x="350" y="58">raw2.mov</text>
<text x="285" y="128">new chat</text>
<text x="10" y="250">title card</text>
<text x="120" y="175" style="fill:#f97316">&lt;= 40 s</text>
</svg>
