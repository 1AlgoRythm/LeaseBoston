<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="The inbox lists questions with status dots, waiting first; the open question shows a reply box, the reply, the matched saved answer with its score, or an add-answer form depending on its status">
