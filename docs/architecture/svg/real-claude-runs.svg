<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="A real Claude session is judged by the database rows its tool calls leave; a repeat question answered from chat history is caught and fixed by a re-ask instruction">
