<path d="M240,185 L262,211 M262,185 L240,211" stroke="#ef4444" stroke-width="3.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.95;1"/></path>
<path d="M142,222 Q330,250 372,128" stroke="#3b82f6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="100;100;0;0;100" keyTimes="0;0.62;0.8;0.95;1"/></path>
