<rect x="341" y="51" width="98" height="22" fill="#f97316" fill-opacity=".35" stroke="none"><animate attributeName="y" dur="6s" repeatCount="indefinite" calcMode="discrete" values="51;83;115;147;179;211" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/></rect>
<circle r="6" fill="#f97316" stroke="none"><animateMotion dur="3s" repeatCount="indefinite" path="M100,78 L170,122"/></circle>
