<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="The model reads the server instructions line by line: never guess, one question per call, send only after a yes, ask again each time">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<rect x="32" y="88" width="250" height="28" rx="6" fill="#f97316" fill-opacity=".25"><animate attributeName="y" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="88;133;178;223"/></rect>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="20" y="25" width="270" height="250" rx="10"/>
<path d="M32,75 L278,75" stroke-width="1.5"/>
<path d="M38,96 L52,110 M52,96 L38,110" stroke="#ef4444" stroke-width="3"/>
<circle cx="45" cy="147" r="6"/>
<circle cx="45" cy="192" r="6"/>
<circle cx="45" cy="237" r="6"/>
<rect x="340" y="95" width="90" height="80" rx="16"/>
<path d="M290,135 L333,135" stroke="#3b82f6" stroke-dasharray="4 6" marker-end="url(#ab)"/>
<path d="M370,160 Q385,170 400,160"/>
</g>
<circle r="5" fill="#f97316"><animateMotion dur="2s" repeatCount="indefinite" path="M290,135 L333,135"/></circle>
<circle cx="365" cy="125" r="5" fill="#3b82f6"><animate attributeName="cy" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="112;120;128;136"/></circle>
<circle cx="405" cy="125" r="5" fill="#3b82f6"><animate attributeName="cy" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" values="112;120;128;136"/></circle>
<text x="40" y="58">INSTRUCTIONS</text>
<text x="62" y="109">never guess</text>
<text x="62" y="153">one question per call</text>
<text x="62" y="198">send only on yes</text>
<text x="62" y="243">ask again each time</text>
</svg>
