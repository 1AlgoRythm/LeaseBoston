<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="A host-name guard in front of the server lets localhost and the tunnel host through and refuses every other host">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M300,30 L300,45 M300,85 L300,135 M300,175 L300,285"/>
<rect x="385" y="85" width="80" height="90" rx="10"/>
<path d="M20,65 L300,65 L383,120" stroke="#f97316" stroke-width="2"/>
<path d="M20,155 L300,155 L383,145" stroke="#3b82f6" stroke-width="2"/>
<path d="M20,245 L270,245" stroke-width="2"/>
<path d="M270,230 L290,260 M290,230 L270,260" stroke="#ef4444" stroke-width="3.5"/>
</g>
<circle r="6" fill="#f97316"><animateMotion dur="6s" repeatCount="indefinite" path="M20,65 L300,65 L383,120"/></circle>
<circle r="6" fill="#3b82f6" opacity="0"><set attributeName="opacity" to="1" begin="2s"/><animateMotion dur="6s" repeatCount="indefinite" begin="2s" path="M20,155 L300,155 L383,145"/></circle>
<circle r="6" fill="#8a8f98" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" begin="4s" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear" path="M20,245 L262,245"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" begin="4s" keyTimes="0;0.5;0.55;1" values="1;1;0;0"/></circle>
<text x="20" y="52">localhost</text>
<text x="20" y="142" style="fill:#3b82f6">tunnel host</text>
<text x="20" y="232">other host</text>
<text x="205" y="22">allowed_hosts</text>
<text x="403" y="135">server</text>
<text x="160" y="278" style="fill:#ef4444">refused</text>
</svg>
