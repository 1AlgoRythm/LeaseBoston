<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="A landlord reply goes to the renter and is also saved as a from_reply answer; the next renter's question matches it instantly">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="25" y="115" width="90" height="50" rx="12"/>
<path d="M115,128 Q200,50 300,60 M115,152 Q150,226 200,226 M385,230 L322,230" stroke-dasharray="2 8" stroke-width="1.5"/>
<rect x="300" y="45" width="44" height="28" rx="3" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.95;1" values="0;0;1;1;0"/></rect>
<path d="M300,45 L322,62 L344,45" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.95;1" values="0;0;1;1;0"/></path>
<rect x="200" y="190" width="120" height="72" rx="8"/>
<path d="M215,208 L305,208 M215,226 L305,226"/>
<path d="M215,246 L305,246" stroke="#3b82f6" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" keyTimes="0;0.38;0.48;0.95;1" values="100;100;0;0;100"/></path>
</g>
<circle r="6" fill="#f97316" stroke="none"><animateMotion dur="8s" repeatCount="indefinite" path="M115,128 Q200,50 300,60" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.27;1" values="1;1;0;0"/></circle>
<circle r="6" fill="#3b82f6" stroke="none"><animateMotion dur="8s" repeatCount="indefinite" path="M115,152 Q150,226 200,226" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.35;0.37;1" values="1;1;0;0"/></circle>
<circle r="6" fill="#f97316" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M385,230 L322,230" keyPoints="0;0;1;0;0" keyTimes="0;0.55;0.68;0.82;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.54;0.55;0.82;0.84;1" values="0;0;1;1;0;0"/></circle>
<text x="70" y="146" text-anchor="middle">reply</text>
<text x="352" y="64" opacity="0">renter told<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.95;1" values="0;0;1;1;0"/></text>
<text x="205" y="182" style="fill:#3b82f6" opacity="0">from_reply<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.95;1" values="0;0;1;1;0"/></text>
<text x="395" y="262" style="font-size:28px">?</text>
<text x="338" y="285">next renter</text>
<text x="336" y="214" style="fill:#f97316" opacity="0">instant<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.7;0.72;0.95;1" values="0;0;1;1;0"/></text>
</svg>
