<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="The first send call sets the status to waiting and sends an email to the landlord and a confirmation to the renter; a second call is turned back with nothing sent twice">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="190" y="105" width="100" height="90" rx="8"/>
<path d="M55,100 L190,135 M55,215 L190,170" stroke-dasharray="2 8" stroke-width="1.5"/>
<rect x="345" y="62" width="38" height="26" rx="3"/><path d="M345,62 L364,78 L383,62"/>
<rect x="345" y="200" width="38" height="26" rx="3"/><path d="M345,200 L364,216 L383,200"/>
<path d="M175,157 L191,173 M191,157 L175,173" stroke="#ef4444" stroke-width="3.5" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.68;0.7;0.95;1" values="0;0;1;1;0"/></path>
</g>
<circle r="6" fill="#f97316" stroke="none"><animateMotion dur="8s" repeatCount="indefinite" path="M55,100 L190,135" keyPoints="0;1;1" keyTimes="0;0.22;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.24;1" values="1;1;0;0"/></circle>
<circle r="6" fill="#f97316" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M290,135 L342,80" keyPoints="0;0;1;1" keyTimes="0;0.3;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.31;0.5;0.52;1" values="0;0;1;1;0;0"/></circle>
<circle r="6" fill="#f97316" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M290,165 L342,214" keyPoints="0;0;1;1" keyTimes="0;0.3;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.31;0.5;0.52;1" values="0;0;1;1;0;0"/></circle>
<circle r="6" fill="#3b82f6" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M55,215 L190,170" keyPoints="0;0;1;0;0" keyTimes="0;0.55;0.68;0.86;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.54;0.55;0.86;0.88;1" values="0;0;1;1;0;0"/></circle>
<text x="240" y="132" text-anchor="middle">status</text>
<text x="240" y="170" text-anchor="middle" style="fill:#f97316" opacity="1">not_sent<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.26;0.28;1" values="1;1;0;0"/></text>
<text x="240" y="170" text-anchor="middle" style="fill:#f97316" opacity="0">waiting<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.26;0.28;1" values="0;0;1;1"/></text>
<text x="390" y="80">landlord</text>
<text x="390" y="218">renter</text>
<text x="40" y="270" style="fill:#ef4444" opacity="0">nothing sent twice<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.7;0.72;0.95;1" values="0;0;1;1;0"/></text>
</svg>
