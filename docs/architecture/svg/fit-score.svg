<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Three score parts with weights 0.4, 0.4 and 0.2 fill up to different heights; their weighted average is the 0 to 100 fit score">
