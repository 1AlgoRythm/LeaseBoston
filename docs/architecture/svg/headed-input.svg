<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Typing sent in the background is ignored by the Claude message box, so real keystrokes in headed mode fill it, then the Send message button and the Allow once button are clicked">
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:15px;fill:#8a8f98}</style>
<g filter="url(#wobble)" fill="none" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="190" y="40" width="270" height="220" rx="10"/>
<rect x="205" y="140" width="130" height="40" rx="6"/>
<circle cx="385" cy="160" r="20"/>
<rect x="205" y="70" width="100" height="35" rx="8"/>
<rect x="15" y="140" width="90" height="40" rx="6"/>
<path d="M30,152 L40,152 M52,152 L62,152 M74,152 L84,152 M36,168 L84,168" stroke-width="2"/>
<path d="M105,160 L200,160" stroke="#f97316" marker-end="url(#ah)" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" dur="1s" repeatCount="indefinite" values="12;0"/></path>
<path d="M30,85 L172,118" stroke="#ef4444" stroke-dasharray="3 8" stroke-width="2"/>
<path d="M172,108 L186,126 M186,108 L172,126" stroke="#ef4444" stroke-width="3.5"/>
<path d="M212,160 L328,160" stroke="#f97316" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;0.5;0.95;1" values="100;100;0;0;100"/></path>
<circle cx="385" cy="160" r="14" fill="#3b82f6" fill-opacity=".6" stroke="none" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.68;0.7;0.78;0.8;1" values="0;0;1;1;0;0"/></circle>
<rect x="209" y="74" width="92" height="27" rx="6" fill="#3b82f6" fill-opacity=".6" stroke="none" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.86;0.88;0.96;1" values="0;0;1;1;0"/></rect>
</g>
<circle r="5" fill="#f97316" stroke="none"><animateMotion dur="1s" repeatCount="indefinite" path="M105,160 L200,160"/></circle>
<circle r="6" fill="#3b82f6" stroke="none" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M440,235 L385,160 L300,100" keyPoints="0;0;0.47;0.47;1;1" keyTimes="0;0.55;0.68;0.76;0.88;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.55;0.56;0.95;0.97;1" values="0;0;1;1;0;0"/></circle>
<text x="15" y="60" style="fill:#ef4444">background: ignored</text>
<text x="15" y="215" style="fill:#f97316">--headed: real keys</text>
<text x="215" y="93">Allow once</text>
<text x="285" y="215">Send message</text>
</svg>
